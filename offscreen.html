  Documento OFFSCREEN: non ha finestra, non ha scheda, non compare all'utente e
  non viene rallentato da Chrome come una finestra ridotta a icona.
  Ospita il motore di scarico (pda_download.js), che qui puo' girare perche':
   - le chiamate al PdA partono dall'origine dell'estensione (host_permissions),
   - DOMParser serve a leggere il DatiAtto ed esiste solo in un documento,
   - i file continuano a essere salvati sul PC via AstarFirmaServer (background).
-->
